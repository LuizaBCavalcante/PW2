<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Carrinho de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-card {
            width: 350px;
            border: none;
            border-radius: 10px;
        }
        .login-header {
            background-color: #0d6efd;
            color: white;
            border-radius: 10px 10px 0 0;
            padding: 20px;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<div class="container d-flex flex-grow-1 justify-content-center align-items-center">
    <div class="text-center">
        <div class="card login-card shadow">
            <div class="login-header">
                <h4 class="mb-0">Acesso ao Sistema</h4>
            </div>
            <div class="card-body text-start p-4">

                <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
                    <small>Usuário ou senha inválidos.</small>
                </div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label text-secondary">Usuário</label>
                        <input type="text" id="username" name="username" class="form-control bg-light" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-secondary">Senha</label>
                        <input type="password" id="password" name="password" class="form-control bg-light" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Entrar</button>
                </form>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/produto/home}" class="text-decoration-none text-primary">Voltar para a Vitrine</a>
        </div>
    </div>
</div>
</body>
</html>
